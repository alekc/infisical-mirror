# Release build. The three ldflags below are the same three the Makefile sets,
# so a release binary and a locally built one report the same shape and a
# `version` output can be traced back to a commit either way.
version: 2

project_name: infisical-mirror

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: infisical-mirror
    main: ./cmd/infisical-mirror
    binary: infisical-mirror
    env:
      # The image below has no libc, and a binary that dlopens NSS at runtime
      # would fail its first DNS lookup inside the container rather than at
      # build time. Nothing here needs cgo.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/alekc/infisical-mirror/internal/cli.Version={{ .Version }}
      - -X github.com/alekc/infisical-mirror/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/alekc/infisical-mirror/internal/cli.BuildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: infisical-mirror
    ids:
      - infisical-mirror
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - examples/config.yaml

# Debian packages, one per linux arch. nfpm skips the darwin builds on its
# own, so the `ids` above cover both and only the linux ones produce a .deb.
nfpms:
  - id: infisical-mirror
    ids:
      - infisical-mirror
    package_name: infisical-mirror
    vendor: alekc
    homepage: https://github.com/alekc/infisical-mirror
    maintainer: Alexander Chernov <alexander@chernov.it>
    description: |-
      Bidirectional mirror between two Infisical instances.
      Walks the folder tree recursively, across several environments, one way
      or both ways per rule. Installs disabled with a dry-run default config.
    license: MIT
    section: utils
    formats:
      - deb
    bindir: /usr/bin
    contents:
      # noreplace on both: an upgrade must never overwrite a config someone
      # has filled in, and the env file is the one holding the credentials.
      - src: packaging/deb/config.yaml
        dst: /etc/infisical-mirror/config.yaml
        type: "config|noreplace"
        file_info:
          mode: 0644
      - src: packaging/deb/env
        dst: /etc/infisical-mirror/env
        type: "config|noreplace"
        file_info:
          mode: 0640
      # /usr/lib, not /lib: every target with systemd has merged /usr, and
      # lintian rejects the aliased path outright.
      - src: packaging/systemd/infisical-mirror.service
        dst: /usr/lib/systemd/system/infisical-mirror.service
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/infisical-mirror/copyright
      - src: examples/config.yaml
        dst: /usr/share/doc/infisical-mirror/examples/config.yaml
      - src: examples/config-minimal.yaml
        dst: /usr/share/doc/infisical-mirror/examples/config-minimal.yaml
    scripts:
      postinstall: packaging/deb/postinstall.sh
      preremove: packaging/deb/preremove.sh
      postremove: packaging/deb/postremove.sh
    deb:
      # Each of these is deliberate. The first two are inherent to a Go binary
      # released by goreleaser; the last three are choices made above, and the
      # 0640 one is load-bearing: /etc/infisical-mirror/env holds credentials.
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package
        - maintainer-script-calls-systemctl
        - no-manual-page
        - non-standard-file-perm

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # `use: github` calls the compare API, which 404s for a tag that has not been
  # pushed yet, so a local --snapshot build fails on it. The local git history
  # is available in both cases.
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# One multi-platform image, built through buildx. The older `dockers` plus
# `docker_manifests` pair does the same job and is deprecated as of v2.12; this
# is a new repository, so there is nothing to migrate later by starting here.
#
# No QEMU is involved: Go cross-compiles the binary and the Dockerfile only
# copies it in, so neither platform runs a foreign instruction at build time.
dockers_v2:
  - images:
      - ghcr.io/alekc/infisical-mirror
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Bidirectional mirror between two Infisical instances"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: "MIT"

release:
  draft: false
  prerelease: auto
